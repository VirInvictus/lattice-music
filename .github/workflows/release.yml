name: Release

# A v* tag auto-publishes to PyPI (publish.yml) and opens the GitHub Release
# here. The Release body is the tag's own message, which is the verbatim
# patchnotes entry per the house tagging procedure. The body is read straight
# off the local annotated tag object: gh's --notes-from-tag is NOT used,
# because inside Actions it silently falls back to the commit message
# (Catagotchi issue #2; this repo's v5.6.0 was one of its casualties, and
# v5.7.0 was repaired from its tag on 2026-11-17). The step runs inside the
# repository and lets the remote be inferred (v5.5.0's run failed on an
# explicit --repo). Stock gh CLI only; no third-party action.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .
          fetch-depth: 0
      # checkout rewrites refs/tags/vX to the resolved commit SHA even after
      # a full fetch (deadbeef-cui v2.0.1 precedent), so the annotated object
      # must be re-fetched --force right before it is read.
      - name: Fetch the annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Create the release from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          OT="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')"
          if [ "$OT" != "tag" ]; then
            echo "::error::tag $TAG is $OT, not an annotated tag; the verbatim patchnotes entry is unavailable"
            exit 1
          fi
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > /tmp/release-notes.md
          TITLE="$(head -1 /tmp/release-notes.md)"
          gh release create "$TAG" --verify-tag --notes-file /tmp/release-notes.md --title "$TITLE"
