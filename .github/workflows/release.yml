name: Release

# A v* tag auto-publishes to PyPI (publish.yml) and opens the GitHub Release
# here. The Release body is the tag's own message, which is the verbatim
# patchnotes entry per the house tagging procedure. Stock gh CLI only: no
# third-party action, and the checkout the other workflows need is not
# required to talk to the releases API. Tags cut before this file existed
# used the manual `gh release create vX --notes-from-tag`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-from-tag \
            --verify-tag
