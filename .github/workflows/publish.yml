name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by SHA (the float tags are movable references);
      # dependabot keeps the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Run test suite
        run: |
          pip install .
          PYTHONPATH=src python -m unittest discover

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lattice-music
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      # A tag/pyproject/config.VERSION disagreement once shipped the wrong
      # build under a permanent PyPI filename (the v5.2.1 incident); refuse
      # to build rather than burn another filename.
      - name: Assert the tag matches the version sync set
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(PYTHONPATH=src python -c "from lattice.config import VERSION; print(VERSION)")
          echo "tag=$TAG pyproject=$PYPROJECT config.VERSION=$PACKAGE"
          if [ "$TAG" != "$PYPROJECT" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::tag/pyproject.toml/config.VERSION disagree; refusing to build"
            exit 1
          fi

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
