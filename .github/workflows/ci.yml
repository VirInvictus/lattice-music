name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by SHA, matching publish.yml; dependabot keeps
      # the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # Pin ruff so a future release adding a lint rule cannot turn a green
      # build red on its own. The same pin lives in the dev group, so local
      # format output matches CI. mutagen and tqdm come in via
      # `pip install .`.
      - run: pip install . ruff==0.15.14
      - run: ruff check src/ scripts/ tests/
      - run: ruff format --check src/ scripts/ tests/
      # PYTHONPATH=src tests the tree, not the pip-installed copy, matching
      # publish.yml: a tree-only failure must surface here, not at tag time.
      - run: PYTHONPATH=src python -m unittest discover
