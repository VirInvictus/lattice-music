<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="lattice-music: filesystem-first music library toolkit">
  <title>lattice-music</title>
  <desc>A waveform built from cells of a lattice, beside the lattice-music wordmark.</desc>
  <style>
    :root { --ink:#24292f; --dim:#57606a; --accent:#2f6f5e; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6e2cf; --dim:#9a978c; --accent:#8ea4a2; }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- 10-column lattice equalizer, bottom-anchored -->
  <g fill="var(--accent, #2f6f5e)">
    <rect x="44" y="132" width="18" height="18" rx="4"/>
    <rect x="67" y="109" width="18" height="18" rx="4"/>
    <rect x="67" y="132" width="18" height="18" rx="4"/>
    <rect x="90" y="109" width="18" height="18" rx="4"/>
    <rect x="90" y="132" width="18" height="18" rx="4"/>
    <rect x="113" y="86"  width="18" height="18" rx="4"/>
    <rect x="113" y="109" width="18" height="18" rx="4"/>
    <rect x="113" y="132" width="18" height="18" rx="4"/>
    <rect x="136" y="86"  width="18" height="18" rx="4"/>
    <rect x="136" y="132" width="18" height="18" rx="4"/>
    <rect x="159" y="109" width="18" height="18" rx="4"/>
    <rect x="159" y="132" width="18" height="18" rx="4"/>
    <rect x="182" y="132" width="18" height="18" rx="4"/>
    <rect x="205" y="109" width="18" height="18" rx="4"/>
    <rect x="205" y="132" width="18" height="18" rx="4"/>
    <rect x="228" y="86"  width="18" height="18" rx="4"/>
    <rect x="228" y="109" width="18" height="18" rx="4"/>
    <rect x="228" y="132" width="18" height="18" rx="4"/>
    <rect x="251" y="132" width="18" height="18" rx="4"/>
  </g>

  <text x="296" y="112" font-size="42" font-weight="700" letter-spacing="-1" fill="var(--ink, #24292f)">lattice-music</text>
  <text x="298" y="142" font-size="13" letter-spacing="3" fill="var(--dim, #57606a)">FILESYSTEM-FIRST MUSIC TOOLKIT</text>
</svg>
