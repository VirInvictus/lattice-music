[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice-music"
version = "5.5.0"
description = "Filesystem-first music library toolkit: trees, integrity, audits, content-hash duplicate detection, health score, write modes"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
  {name = "vrnvctss"}
]
dependencies = [
    "vir-tui>=2.5.0",
    "mutagen>=1.46.0",
    "tqdm>=4.65.0"
]

[project.scripts]
lattice = "lattice.cli:main"

[project.optional-dependencies]
pyinstaller = ["pyinstaller>=6.0"]

[tool.hatch.envs.default]
dependencies = [
    "vir-tui>=2.5.0",
    "pyinstaller>=6.0"
]

[tool.hatch.envs.default.scripts]
build-bin = "pyinstaller --onefile --name lattice --paths src src/lattice/__main__.py"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.15.14",
]


[tool.ruff]
lint.extend-ignore = ["DTZ005", "SIM115", "S102", "S112", "SIM102", 'BLE001', 'S110', 'EXE001', 'B017', 'SIM117', 'RUF012', 'PLW1510', 'E402']

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]

